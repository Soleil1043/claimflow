# 交付架构：PostgreSQL + Qdrant + Redis + init(自举) + app 五服务
# 使用：docker compose up -d --build
# 说明：init 容器跑 alembic 迁移 + Mock 种子 + 知识库向量化后退出，app 随后启动（prod profile），
# LLM_API_KEY 从 .env 或环境变量注入；BGE-M3 模型缓存在 hf_cache 卷（二次启动免下载）
# 监控栈（Prometheus + Grafana）：docker compose --profile monitoring up -d，默认不启动
# 追踪栈（OTel Collector + Jaeger）：docker compose --profile tracing up -d，默认不启动
services:
  postgres:
    # pgvector 变体镜像：长期记忆 AsyncPostgresStore 向量索引依赖 vector 扩展，
    # 官方 postgres:16-alpine 不带（数据卷与 postgres:16 兼容）
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claim_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # v1.18.x 对齐 qdrant-client 1.19（client/server minor 差 ≤1 的兼容窗口；
    # 原 v1.12.6 与 client 差 7 个 minor，启动警告且升级有断裂风险）
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 镜像无 curl/wget，用 bash 内建 /dev/tcp 探活
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== 初始化容器（BUG-004）：迁移 + Mock 种子 + 知识库向量化，成功退出后 app 才启动 =====
  # 顺序强制：alembic 必须先于 seed（seed 的 init_db 是 create_all 兜底，先建表会让 app 的迁移撞已存在表）
  # 首次启动 ingest 会下载 BGE-M3（~2.3G）到 hf_cache 卷；缓存命中时注入快照目录直载（秒级，免在线校验重下载）
  init:
    build: .
    image: claimflow:ci
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "MODEL_DIR=$$(find /root/.cache/huggingface/hub/models--BAAI--bge-m3/snapshots -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1); if [ -n \"$$MODEL_DIR\" ]; then export EMBEDDING_MODEL_PATH=\"$$MODEL_DIR\" HF_OFFLINE=1; fi; uv run --no-dev alembic upgrade head && uv run --no-dev python -m scripts.seed && uv run --no-dev python -m services.rag.ingest",
      ]
    environment:
      APP_PROFILE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
      QDRANT_URL: http://qdrant:6333
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  app:
    build: .
    image: claimflow:ci
    environment:
      APP_PROFILE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 坐席端点鉴权（T147）：演示栈默认注入公开演示账号（与冒烟脚本 fallback 对齐）；
      # 生产部署必须显式覆盖 STAFF_KEYS（强随机 Key），否则 prod 校验会拒绝启动
      STAFF_KEYS: ${STAFF_KEYS:-demo-staff:demo-key-2026}
      # 编排模式：默认 LLM 编排；CI 端到端冒烟设 false 走确定性编排（消除模型抖动，
      # 材料提取仍按 Key 有无决定走真实 LLM 或 Mock 兜底）
      ORCHESTRATOR_LLM_ENABLED: ${ORCHESTRATOR_LLM_ENABLED:-true}
      # 追踪接线：开关从 .env 透传；容器内 endpoint 固定服务名（.env 里的
      # localhost:4317 是宿主机直跑进程用的，透传进容器会指向容器自身）
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # ===== 监控栈（T025，独立 profile）：docker compose --profile monitoring up -d =====
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # 演示场景免登录直读面板（生产应移除并配置正式认证）
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  # ===== 追踪栈（T039，独立 profile）：docker compose --profile tracing up -d =====
  # 应用（宿主进程或 app 容器）OTLP 上报 → collector:4317 → jaeger:4318
  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: claimflow-jaeger
    profiles: ["tracing"]
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector:0.123.0
    container_name: claimflow-otel-collector
    profiles: ["tracing"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # 应用 OTLP gRPC 上报入口
    depends_on:
      - jaeger

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
  hf_cache:
