# 交付架构：PostgreSQL + Qdrant + Redis + app 四服务（plan.md F01）
# 使用：docker compose up -d --build
# 说明：app 以 prod profile 运行，LLM_API_KEY 从 .env 或环境变量注入
# 监控栈（Prometheus + Grafana）：docker compose --profile monitoring up -d，默认不启动
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claim_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 镜像无 curl/wget，用 bash 内建 /dev/tcp 探活
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: claimflow:ci
    environment:
      APP_PROFILE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== 监控栈（T025，独立 profile）：docker compose --profile monitoring up -d =====
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # 演示场景免登录直读面板（生产应移除并配置正式认证）
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
