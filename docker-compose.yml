# 交付架构：PostgreSQL + Qdrant + Redis + app 四服务（plan.md F01）
# 使用：docker compose up -d --build
# 说明：app 以 prod profile 运行，LLM_API_KEY 从 .env 或环境变量注入
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claim_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 镜像无 curl/wget，用 bash 内建 /dev/tcp 探活
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: claimflow:ci
    environment:
      APP_PROFILE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claimpass
      POSTGRES_DB: claim_agent
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_data:
  redis_data:
