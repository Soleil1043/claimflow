# 交付架构：PostgreSQL + Qdrant + Redis + init(自举) + app 五服务
# 使用：docker compose up -d --build
# 说明：init 容器跑 alembic 迁移 + Mock 种子 + 知识库向量化后退出，app 随后启动（prod profile），
# LLM_API_KEY 从 .env 或环境变量注入；BGE-M3 模型缓存在 hf_cache 卷（二次启动免下载）
# 监控栈（Prometheus + Grafana）：docker compose --profile monitoring up -d，默认不启动
# 追踪栈（OTel Collector + Jaeger）：docker compose --profile tracing up -d，默认不启动
# 暴露面（T217/I14，D094）：只有 app:8000 对外发布；数据服务与观测 UI 仅绑 127.0.0.1
# （compose 内网互访不需要发布宿主端口，发布只为本机调试/评测）。.env 必填
# STAFF_KEYS / PII_ENCRYPTION_KEY / POSTGRES_PASSWORD / REDIS_PASSWORD，缺则 compose 报错
services:
  postgres:
    # pgvector 变体镜像：长期记忆 AsyncPostgresStore 向量索引依赖 vector 扩展，
    # 官方 postgres:16-alpine 不带（数据卷与 postgres:16 兼容）
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: claim_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claim_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # v1.18.x 对齐 qdrant-client 1.19（client/server minor 差 ≤1 的兼容窗口；
    # 原 v1.12.6 与 client 差 7 个 minor，启动警告且升级有断裂风险）
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 镜像无 curl/wget，用 bash 内建 /dev/tcp 探活
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 访问口令（T217/I14）：此前无 requirepass，端口又绑 0.0.0.0——同网段任意主机可
    # FLUSHALL / 读走缓存
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (see .env.example)}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 带口令 ping：无口令时 redis-cli 返回 NOAUTH 但退出码仍为 0，须判 PONG
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== 初始化容器（BUG-004）：迁移 + Mock 种子 + 知识库向量化，成功退出后 app 才启动 =====
  # 顺序强制：alembic 必须先于 seed（seed 的 init_db 是 create_all 兜底，先建表会让 app 的迁移撞已存在表）
  # 首次启动 ingest 会下载 BGE-M3（~2.3G）到 hf_cache 卷；缓存命中时注入快照目录直载（秒级，免在线校验重下载）
  init:
    build: .
    image: claimflow:ci
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "MODEL_DIR=$$(find /root/.cache/huggingface/hub/models--BAAI--bge-m3/snapshots -mindepth 2 -maxdepth 2 -name config.json 2>/dev/null | head -n 1 | xargs -r dirname); if [ -n \"$$MODEL_DIR\" ]; then export EMBEDDING_MODEL_PATH=\"$$MODEL_DIR\" HF_OFFLINE=1; fi; uv run --no-dev alembic upgrade head && uv run --no-dev python -m scripts.seed && uv run --no-dev python -m services.rag.ingest",
      ]
    environment:
      APP_PROFILE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: claim_agent
      QDRANT_URL: http://qdrant:6333
      # 坐席鉴权（T147）：init 也是 prod profile。必填注入（T216/I13）——此前仓库
      # 公开的演示账号兜底，漏配 .env 的生产部署会带公开口令静默通过 prod 校验
      STAFF_KEYS: ${STAFF_KEYS:?set STAFF_KEYS in .env, format name:random-key (see .env.example)}
      # HF 下载镜像（可选，T156）：冷自举匿名下载 BGE 2.3G 会被官方限速
      # （实测 ~1MB/s，30 分钟+）；CI 设 HF_ENDPOINT=https://hf-mirror.com 提速
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      # PII 库内加密密钥（T176，D082）：必填注入，init 与 app 必须同密钥（迁移写、应用读）
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?set a random PII_ENCRYPTION_KEY in .env (see .env.example)}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  app:
    build: .
    image: claimflow:ci
    environment:
      APP_PROFILE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: claim_agent
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 坐席端点鉴权（T147/T216）：必填注入；冒烟脚本从环境读同一变量（无演示 fallback）
      STAFF_KEYS: ${STAFF_KEYS:?set STAFF_KEYS in .env, format name:random-key (see .env.example)}
      # 编排模式：默认 LLM 编排；CI 端到端冒烟设 false 走确定性编排（消除模型抖动，
      # 材料提取仍按 Key 有无决定走真实 LLM 或 Mock 兜底）
      ORCHESTRATOR_LLM_ENABLED: ${ORCHESTRATOR_LLM_ENABLED:-true}
      # 追踪接线：开关从 .env 透传；容器内 endpoint 固定服务名（.env 里的
      # localhost:4317 是宿主机直跑进程用的，透传进容器会指向容器自身）
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: http://otel-collector:4317
      # T166：采样率从 .env 透传（此前未透传，容器内落config.py 默认值）；
      # 1.0 全采样下每请求数十 span，0.2 足够 trace_id 级排障
      OTEL_SAMPLING_RATIO: ${OTEL_SAMPLING_RATIO:-0.2}
      # 同 init：HF 镜像透传（仅在卷内无快照需要在线补拉时生效）
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      # PII 库内加密密钥（T176，D082/T216）：必填注入，init 与 app 必须同密钥
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?set a random PII_ENCRYPTION_KEY in .env (see .env.example)}
      # LLM 单价表（T177，D083）：容器内成本估算与 .env 同源（T166 教训：不透传落默认值）
      LLM_PRICING: ${LLM_PRICING:-}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # ===== 监控栈（T025，独立 profile）：docker compose --profile monitoring up -d =====
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    # T166：TSDB 保留期 30d。v3 已把该项移出配置文件（配置文件里写
    # storage.tsdb.retention.time / global.retention_time 均报 "field not found in
    # type config.plain"，promtool check config 实锤），只保留命令行 flag。
    # 注：--storage.tsdb.max-samples-per-query 在 v3.1 不存在（unknown long flag），
    # 查询侧上限改由 Grafana 面板自身控制，不在服务端加。
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    ports:
      # 宿主 3001：避开 chatui dev 的 3000；仅本机
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # 匿名只读看面板（T217/I14）：此前匿名即 Admin + admin/admin，可改数据源/告警、
      # 借数据源探测内网。面板/数据源/告警全走文件 provisioning，演示无需管理员登录——
      # 关登录表单与 Basic Auth，admin 账号经 HTTP 不可用；需要管理时自行配正式认证
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    depends_on:
      - prometheus

  # ===== 追踪栈（T039，独立 profile）：docker compose --profile tracing up -d =====
  # 应用（宿主进程或 app 容器）OTLP 上报 → collector:4317 → jaeger:4318
  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: claimflow-jaeger
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector:0.123.0
    container_name: claimflow-otel-collector
    profiles: ["tracing"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # 应用 OTLP gRPC 上报入口（宿主进程本机上报）
    depends_on:
      - jaeger

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
  hf_cache:
