name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint & Test 测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Lint（ruff）
        run: uv run ruff check app tests services schemas nodes tools workflows scripts evals

      # 覆盖率门禁（T149）：基线 88%（2026-09-23 实测），阈值 85% 留 3pp 缓冲；
      # 低覆盖区为可选模块（reranker/tracing 默认关、ingest CLI 型），记录于 D068
      - name: 测试（pytest + 覆盖率 ≥85%）
        run: >
          uv run pytest tests -q
          --cov=app --cov=nodes --cov=services --cov=tools
          --cov=schemas --cov=workflows --cov=state
          --cov-fail-under=85

  # 前端门禁（T148）：两个 Next.js 应用的 lint + build——此前只靠本地手动验证
  frontend:
    name: 前端 Lint & Build（${{ matrix.dir }}）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    strategy:
      fail-fast: false
      matrix:
        dir: [chatui, workbench]
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci

      - name: Lint（next lint）
        run: npm run lint

      - name: 构建（next build）
        run: npm run build

  docker:
    name: Docker Build & Compose 校验
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Compose 配置校验
        run: docker compose config -q

      - name: 构建应用镜像
        run: docker build -t claimflow:ci .

      - name: 启动全栈并验证健康检查
        env:
          # 配置了 secret 就用真 Key（冒烟升级为完整档）；未配置（fork PR 无 secret）
          # 时退回占位值——健康检查只校验 Key 非空，口径与既往一致
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'sk-ci-placeholder' }}
          # 冒烟一律走确定性编排：调度不依赖模型规划稳定性（材料提取仍按 Key 有无
          # 决定走真实 LLM 或 Mock 兜底），避免偶发抖动让 CI 变红
          ORCHESTRATOR_LLM_ENABLED: "false"
        run: |
          docker compose up -d --no-build
          # 等待 app 就绪（最多 60s）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      # 端到端冒烟（T092/T143/T145）：对 compose 全栈跑五组真实链路——受理与自动
      # 签发、审计时间线、补件闭环、未上线险种 escape、工单列表。
      # 默认走**离线兜底档**（--offline，零 API Key）：材料提取降级 Mock → 置信度
      # 不足按设计转人工，门禁守"上传落档/状态机/审计/escape/工单"；签发结论与
      # 核定金额由零 LLM 的评测门（eval-gate）coverage，两条门分工不重叠。
      - name: 端到端冒烟（离线兜底档，零 API Key）
        if: ${{ secrets.LLM_API_KEY == '' }}
        run: uv run python -m scripts.verify_adjudication --base-url http://localhost:8000 --offline

      # 配了 LLM_API_KEY secret 才升级为完整档（真实 LLM 提取 + 自动签发 4640.00
      # + 决定书）；未配置则跳过，不阻塞无 secret 的 fork PR
      - name: 端到端冒烟（完整档，真实 LLM，需 secret）
        if: ${{ secrets.LLM_API_KEY != '' }}
        run: uv run python -m scripts.verify_adjudication --base-url http://localhost:8000

      - name: 清理
        if: always()
        run: docker compose down -v

  eval-gate:
    name: 核赔评测门禁（金样本确定性回归，T094 改造）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      # 确定性模式零 LLM、零向量库（mock 种子 + 临时文件库自包含），
      # 六门检查（金额 100%/红线 0/守卫拦截 100% 等）不过即退出码非 0
      - name: 运行核赔金样本评测（确定性全量）
        run: uv run python -m evals.adjudication_suite

      # 对抗门（T124）：injection 注入/诱导层进门禁（结构化字段与守卫不被文本操纵），
      # robustness 同义词层仅报告不拦截（确定性关键词已知缺口，驱动 skill 迭代）
      - name: 运行对抗回归门（注入层硬门）
        run: uv run python -m evals.adjudication_suite --dataset adversarial

      - name: 上传评测报告产物
        uses: actions/upload-artifact@v4
        with:
          name: eval-ci-report
          path: |
            evals/reports/t089_adjudication_gate.json
            evals/reports/t124_adversarial_gate.json
