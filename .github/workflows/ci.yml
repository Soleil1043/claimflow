name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint & Test 测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Lint（ruff）
        run: uv run ruff check app tests services schemas nodes agents tools workflows scripts ui

      - name: 测试（pytest）
        run: uv run pytest tests -q

  docker:
    name: Docker Build & Compose 校验
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: Compose 配置校验
        run: docker compose config -q

      - name: 构建应用镜像
        run: docker build -t claimflow:ci .

      - name: 启动全栈并验证健康检查
        run: |
          LLM_API_KEY=sk-ci-placeholder docker compose up -d --no-build
          # 等待 app 就绪（最多 60s）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker compose down -v

  eval-gate:
    name: 评测回归门禁（smoke 20 条）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      # BGE-M3 嵌入模型 ~2GB：按模型目录缓存，避免每次 CI 全量下载
      - name: 缓存 HuggingFace 嵌入模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-bge-m3-${{ runner.os }}

      # LLM_API_KEY secret 缺失（fork PR / 未配置）时跳过而非失败（D033）
      - name: 检测评测密钥
        run: echo "HAS_KEY=${{ secrets.LLM_API_KEY != '' }}" >> "$GITHUB_ENV"

      - name: 重建知识库向量索引
        if: env.HAS_KEY == 'true'
        run: uv run python -m services.rag.ingest

      - name: 运行 smoke 评测（20 条）
        if: env.HAS_KEY == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run python -m evals.test_suite --limit 20 --out ci_report.json

      - name: 门禁判定（完成率降幅 >5pp 拦截）
        if: env.HAS_KEY == 'true'
        run: uv run python scripts/check_eval_gate.py ci_report.json

      - name: 上传评测报告产物
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-ci-report
          path: ci_report.json
