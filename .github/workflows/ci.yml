name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 夜间真实 LLM 门（T151）：每日北京 04:00（UTC 20:00）触发 nightly-llm job；
  # workflow_dispatch 供手动触发（首夜验证 / 按需回归）
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint & Test 测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Lint（ruff）
        run: uv run ruff check app tests services schemas nodes tools workflows scripts evals

      # 覆盖率门禁（T149）：基线 88%（2026-09-23 实测），阈值 85% 留 3pp 缓冲；
      # 低覆盖区为可选模块（reranker/tracing 默认关、ingest CLI 型），记录于 D068
      - name: 测试（pytest + 覆盖率 ≥85%）
        run: >
          uv run pytest tests -q
          --cov=app --cov=nodes --cov=services --cov=tools
          --cov=schemas --cov=workflows --cov=state
          --cov-fail-under=85

      # 依赖漏洞审计（T152，D070）：已知漏洞即红；本地项目与 torch+cpu 本地变体
      # 为合理跳过项（不在 PyPI）
      - name: 依赖审计（pip-audit）
        run: uv run pip-audit --progress-spinner off

  # 前端门禁（T148）：两个 Next.js 应用的 lint + build——此前只靠本地手动验证
  frontend:
    name: 前端 Lint & Build（${{ matrix.dir }}）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    strategy:
      fail-fast: false
      matrix:
        dir: [chatui, workbench]
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci

      # 依赖漏洞审计（T152，D070）：high 及以上即红（moderate 不阻塞）
      - name: 依赖审计（npm audit ≥high）
        run: npm audit --audit-level=high

      - name: Lint（next lint）
        run: npm run lint

      - name: 构建（next build）
        run: npm run build

  docker:
    name: Docker Build & Compose 校验
    runs-on: ubuntu-latest
    env:
      # step 级 if 不可用 secrets context（GitHub 工作流校验直接拒绝、run 瞬时失败
      # 零 job——push 后 actionlint 实锤）：job 级 env 承接档位判定，step 条件读 env
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
      # 冷自举 BGE 下载走镜像（T156 实锤：官方匿名限速 ~1MB/s，2.3G 超 30 分钟）；
      # compose 经 ${HF_ENDPOINT:-} 透传给 init/app，本地/生产不设不受影响
      HF_ENDPOINT: https://hf-mirror.com
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Compose 配置校验
        run: |
          docker compose config -q
          # 多副本组合（T156）一并校验：runner compose 版本过旧不支持 !override 时在此显式失败
          docker compose -f docker-compose.yml -f docker-compose.replicas.yml config -q

      - name: 构建应用镜像
        run: docker build -t claimflow:ci .

      # BGE-M3 模型缓存（与 nightly-llm job 同 key 共享）：runner 在线下载 2.3G
      # 易被 HF 限流（匿名下载 429），init 挂 → app 永不启动 → 健康检查超时。
      # 命中缓存则预灌 claimflow_hf_cache 卷；首跑在线自举，成功后回填供下次
      - name: 缓存 BGE-M3 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-m3

      - name: 预灌 hf_cache 卷（缓存命中时）
        run: |
          if [ -d "$HOME/.cache/huggingface/hub/models--BAAI--bge-m3" ]; then
            docker volume create claimflow_hf_cache
            docker run --rm -v "$HOME/.cache/huggingface/hub:/src:ro"               -v claimflow_hf_cache:/dst alpine cp -r /src /dst/hub
            echo "hf_cache seeded from actions cache"
          else
            echo "cache miss——init 容器在线下载自举（成功后回填）"
          fi


      - name: 启动全栈并验证健康检查
        env:
          # 配置了 secret 就用真 Key（冒烟升级为完整档）；未配置（fork PR 无 secret）
          # 时退回占位值——健康检查只校验 Key 非空，口径与既往一致
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'sk-ci-placeholder' }}
          # 冒烟一律走确定性编排：调度不依赖模型规划稳定性（材料提取仍按 Key 有无
          # 决定走真实 LLM 或 Mock 兜底），避免偶发抖动让 CI 变红
          ORCHESTRATOR_LLM_ENABLED: "false"
        run: |
          docker compose up -d --no-build
          # 等待 app 就绪：app 容器等 init（首次下载 BGE-M3 ~2.3G + 2 vCPU ingest）
          # 完成才启动——冷 runner 上 init 需数分钟，窗口给足 15 分钟
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 10
          done
          cat /tmp/health.json || true
          if ! grep -q '"status":"ok"' /tmp/health.json 2>/dev/null; then
            # 遥测进 annotations（::error:: 匿名 API 可读）——栈起不来时在这里拿根因
            echo "::error title=健康检查未通过::$(head -c 300 /tmp/health.json 2>/dev/null)"
            echo "::error title=容器状态::$(docker compose ps -a 2>&1 | tail -c 400)"
            echo "::error title=init日志尾::$(docker compose logs init 2>&1 | tail -c 600)"
            echo "::error title=app日志尾::$(docker compose logs app 2>&1 | tail -c 600)"
            exit 1
          fi

      # 端到端冒烟（T092/T143/T145）：对 compose 全栈跑五组真实链路——受理与自动
      # 签发、审计时间线、补件闭环、未上线险种 escape、工单列表。
      # 默认走**离线兜底档**（--offline，零 API Key）：材料提取降级 Mock → 置信度
      # 不足按设计转人工，门禁守"上传落档/状态机/审计/escape/工单"；签发结论与
      # 核定金额由零 LLM 的评测门（eval-gate）coverage，两条门分工不重叠。
      - name: 端到端冒烟（离线兜底档，零 API Key）
        if: ${{ env.HAS_LLM_KEY != 'true' }}
        run: uv run python -m scripts.verify_adjudication --base-url http://localhost:8000 --offline

      # 配了 LLM_API_KEY secret 才升级为完整档（真实 LLM 提取 + 自动签发 4640.00
      # + 决定书）；未配置则跳过，不阻塞无 secret 的 fork PR
      - name: 端到端冒烟（完整档，真实 LLM，需 secret）
        if: ${{ env.HAS_LLM_KEY == 'true' }}
        run: uv run python -m scripts.verify_adjudication --base-url http://localhost:8000

      # 多实例 live 冒烟（T156，D072）：同栈不清理直接扩双副本（只 recreate app，
      # init 已完成、hf_cache 卷保留→BGE 不重下）——8000/8001 两端口，跨实例
      # 补件恢复实测（A 提交→B 补件→终态+零 schema_reset=共享 checkpoint 证明，
      # 双向对称）。测的是 prod 多实例形态（PG checkpoint + 租约在真 PostgreSQL）
      - name: 扩至双副本（replicas override）
        run: docker compose -f docker-compose.yml -f docker-compose.replicas.yml up -d --no-build --scale app=2

      - name: 等待双副本就绪
        run: |
          for port in 8000 8001; do
            ok=0
            for _ in $(seq 1 90); do
              if curl -sf http://localhost:$port/health > /dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then echo "端口 $port 未就绪"; exit 1; fi
          done

      - name: 多实例冒烟（离线兜底档，零 API Key）
        if: ${{ env.HAS_LLM_KEY != 'true' }}
        run: uv run python -m scripts.verify_multiinstance --base-url-a http://localhost:8000 --base-url-b http://localhost:8001 --offline

      - name: 多实例冒烟（完整档，真实 LLM，需 secret）
        if: ${{ env.HAS_LLM_KEY == 'true' }}
        run: uv run python -m scripts.verify_multiinstance --base-url-a http://localhost:8000 --base-url-b http://localhost:8001

      - name: 回填模型缓存（完整快照才回填）
        if: always()
        run: |
          ok=$(docker run --rm -v claimflow_hf_cache:/src:ro alpine sh -c             'find /src/hub/models--BAAI--bge-m3/snapshots -name model.safetensors 2>/dev/null | head -1' || true)
          if [ -n "$ok" ]; then
            mkdir -p "$HOME/.cache/huggingface/hub"
            docker run --rm -v claimflow_hf_cache:/src:ro               -v "$HOME/.cache/huggingface/hub:/dst" alpine sh -c               'rm -rf /dst/models--BAAI--bge-m3 && cp -r /src/hub/models--BAAI--bge-m3 /dst/'
            echo "cache backfilled"
          fi

      - name: 清理
        if: always()
        run: docker compose down -v

  eval-gate:
    name: 核赔评测门禁（金样本确定性回归，T094 改造）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      # 确定性模式零 LLM、零向量库（mock 种子 + 临时文件库自包含），
      # 六门检查（金额 100%/红线 0/守卫拦截 100% 等）不过即退出码非 0
      - name: 运行核赔金样本评测（确定性全量）
        run: uv run python -m evals.adjudication_suite

      # 对抗门（T124）：injection 注入/诱导层进门禁（结构化字段与守卫不被文本操纵），
      # robustness 同义词层仅报告不拦截（确定性关键词已知缺口，驱动 skill 迭代）
      - name: 运行对抗回归门（注入层硬门）
        run: uv run python -m evals.adjudication_suite --dataset adversarial

      - name: 上传评测报告产物
        uses: actions/upload-artifact@v4
        with:
          name: eval-ci-report
          path: |
            evals/reports/t089_adjudication_gate.json
            evals/reports/t124_adversarial_gate.json

  # 夜间真实 LLM 门（T151，D070）：客服门 15 案 / 对抗门 LLM 档 14 案 / 主门 LLM
  # 档抽样 20 案——回归靠日历不靠记性。需 LLM_API_KEY secret（无则整 job skip，
  # fork 场景不红）；BGE-M3 模型走 cache（~2.3GB，模型不变则命中），ingest 重建
  # 向量索引（data/qdrant 不入库）。北京 04:00 = UTC 20:00。
  nightly-llm:
    name: 夜间真实 LLM 门（客服/对抗/主门抽样）
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      # 同 docker job：secrets 不能进 step-if，job 级 env 承接
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
      # BGE 下载镜像（cache 未命中首跑的 ingest 提速；命中时无感）
      HF_ENDPOINT: https://hf-mirror.com
    steps:
      - name: 拉取项目代码到ubuntu
        uses: actions/checkout@v4

      - name: 检查 LLM secret
        id: has_key
        if: ${{ env.HAS_LLM_KEY != 'true' }}
        run: |
          echo "LLM_API_KEY secret 未配置，跳过夜间门（fork 场景）"
          exit 1

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 缓存 BGE-M3 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-m3
          lookup-only: false

      - name: 重建知识库向量索引
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run python -m services.rag.ingest

      - name: 对抗门（LLM 模式 14 案）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run python -m evals.adjudication_suite --dataset adversarial --llm

      - name: 客服问答门（15 案）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run python -m evals.support_suite

      - name: 主门 LLM 档抽样（20 案）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run python -m evals.adjudication_suite --llm --limit 20

      - name: 上传夜间报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-llm-report
          path: |
            evals/reports/t124_adversarial_gate.json
            evals/reports/t146_support_qa_gate.json
            evals/reports/t089_adjudication_gate.json
