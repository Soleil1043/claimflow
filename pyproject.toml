[project]
name = "claim-agent"
version = "0.1.0"
description = "多智能体保险理赔对话系统（Orchestrator-Worker 架构）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",      # FastAPI 文件上传（A07 OCR）必需
    # Agent 框架
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.1",   # PostgresSaver/AsyncPostgresSaver（psycopg 驱动）
    "psycopg[binary,pool]>=3.2",            # checkpoint 的 PG 驱动（Windows 需 binary）
    "langchain-core>=0.3",
    "langchain-openai>=0.2",         # DeepSeek 走 OpenAI 兼容接口
    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",                 # PostgreSQL 异步驱动（prod）
    "aiosqlite>=0.20",               # SQLite 异步驱动（dev 降级）
    "alembic>=1.13",
    # 向量库与 Embedding
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",    # 本地 BGE-M3
    # 缓存
    "redis>=5.0",
    # 配置与日志
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.0",
    # HTTP 客户端
    "httpx>=0.27",
    # 演示界面
    "gradio>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic 目录为工具生成/模板代码，不做 lint
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "nodes", "tools", "services", "workflows", "schemas", "ui", "scripts"]
